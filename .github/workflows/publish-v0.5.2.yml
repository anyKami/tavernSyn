name: Publish TavernSyn v0.5.2 stable
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.5.2.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.repository == 'anyKami/tavernSyn' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exactly the tested commit
        uses: actions/checkout@v4
        with:
          ref: dd9aee05f366bc41ebf778fbf22fd8b11e58cb30
          persist-credentials: false
      - name: Verify exact source, publish stable tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: dd9aee05f366bc41ebf778fbf22fd8b11e58cb30
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(node -p "require('./package.json').version")" = "0.5.2"
          test "$(node -p "require('./manifest.json').version")" = "0.5.2"
          gh api repos/anyKami/tavernSyn/actions/runs/45042947536 > "$RUNNER_TEMP/ci.json"
          jq -e --arg sha "$TESTED_SHA" '.head_sha == $sha and .status == "completed" and .conclusion == "success"' "$RUNNER_TEMP/ci.json"
          existing="$(gh api repos/anyKami/tavernSyn/git/ref/tags/v0.5.2 2>/dev/null | jq -r '.object.sha // empty' || true)"
          if [ -n "$existing" ]; then
            test "$existing" = "$TESTED_SHA" || { echo "::error::existing v0.5.2 does not match verified source"; exit 1; }
          else
            gh api -X POST repos/anyKami/tavernSyn/git/refs -f ref=refs/tags/v0.5.2 -f sha="$TESTED_SHA"
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## USB 方向点击立即可见
          - 在电脑或手机点「电脑 → 手机」或「手机 → 电脑」后，按钮立即收起，显示已发起的方向和状态，不必等待后端 HTTP 回应。
          - 在 USB 卡片内和手机屏幕底部固定浮动区域显示当前同步阶段；当方向确认回执丢失时会自动查询后台状态，不会直接重复发送覆盖请求。

          ## 传输真实进度
          - 从实际 USB 文件流统计已发送／已接收的文件内容字节数；显示总字节、百分比和文件数量。
          - 包含快照准备、传输、SHA-256 校验、插件准备、应用、健康检查和重启各阶段。
          - 已传输 100% 不代表覆盖完成；最终成功会持续显示 100% 与「同步完成」。
          - 酒馆关闭期间，受控启动器在原酒馆端口提供凭单保护、只读的 USB 状态接口。酒馆重启后恢复原有 API 与页面。

          ## 测试
          - [准确源码的完整 GitHub Actions CI](https://github.com/anyKami/tavernSyn/actions/runs/45042947536)：Windows Node 22、Linux Node 20、Linux 全量真实酒馆流程和 Chromium 触屏检查全部通过。
          - 包括点击反馈、丢失确认响应、酒馆停机时真实 1 MiB / 2 MiB 进度展示、传输 100% 后继续校验、完整成功态，以及双端真实文件字节计数。
          - 物理 Windows ↔ Android USB 数据线仍未在实体设备实测；自动测试使用实际本机 HTTP 流和真实 SillyTavern 进程，ADB 转发模拟。
          - 电脑及手机从 TavernSyn 正常受控启动入口重新启动，会按稳定标签自动更新前后端；两端请更新到同一版本。

          [USB 使用指南](https://github.com/anyKami/tavernSyn/blob/v0.5.2/docs/usb-sync.md) · [更新记录](https://github.com/anyKami/tavernSyn/blob/v0.5.2/CHANGELOG.md)
          NOTES
          if gh release view v0.5.2 --repo anyKami/tavernSyn >/dev/null 2>&1; then
            gh release view v0.5.2 --repo anyKami/tavernSyn --json isDraft,isPrerelease --jq '.isDraft == false and .isPrerelease == false' | grep -qx true
          else
            gh release create v0.5.2 --repo anyKami/tavernSyn --verify-tag --latest --title 'TavernSyn v0.5.2 — USB 实时进度与即时反馈' --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
