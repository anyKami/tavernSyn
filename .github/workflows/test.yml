name: Test
on: [push, pull_request, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare pinned SillyTavern fixture dependencies
        run: |
          git clone https://github.com/SillyTavern/SillyTavern.git "$RUNNER_TEMP/SillyTavern"
          git -C "$RUNNER_TEMP/SillyTavern" checkout 06bde939fb1e9c4c8d8641d810f0a916b5bce127
          npm --prefix "$RUNNER_TEMP/SillyTavern" ci --omit=dev --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y rsync
      - name: Unit, Linux locks, rsync and actual server lifecycle
        env:
          SILLYTAVERN_SOURCE: ${{ runner.temp }}/SillyTavern
          TAVERNSYN_TEST_REPORT: ${{ runner.temp }}/tavernsyn-lifecycle-results.json
          TAVERNSYN_DRIVE_TEST_REPORT: ${{ runner.temp }}/tavernsyn-drive-results.json
          TAVERNSYN_USB_TEST_REPORT: ${{ runner.temp }}/tavernsyn-usb-results.json
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/*.test.mjs
          python -m unittest discover -s tests -p 'test_vps*.py' -v
          node tests/rsync.mjs
          node tests/integration.mjs
          node tests/usb-integration.mjs
          node tests/drive-integration.mjs
      - name: Chromium Android layout and automatic Drive and USB flows
        run: |
          npm install --prefix "$RUNNER_TEMP/tavernsyn-browser" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/tavernsyn-browser/node_modules/.bin/playwright" install --with-deps chromium
          TAVERNSYN_PLAYWRIGHT_PACKAGE="$RUNNER_TEMP/tavernsyn-browser/node_modules/playwright/package.json" TAVERNSYN_BROWSER_OUTPUT="$RUNNER_TEMP/tavernsyn-browser-results" node tests/drive-browser.mjs
      - name: Preserve synchronization integration and browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-drive-tests
          path: |
            ${{ runner.temp }}/tavernsyn-drive-results.json
            ${{ runner.temp }}/tavernsyn-lifecycle-results.json
            ${{ runner.temp }}/tavernsyn-usb-results.json
            ${{ runner.temp }}/tavernsyn-browser-results
          if-no-files-found: ignore
  portable:
    strategy:
      matrix:
        include:
          - os: windows-latest
            node: '22'
          - os: ubuntu-latest
            node: '20'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: USB protocol, ADB selection and entry points
        run: node --test tests/usb-adb.test.mjs tests/usb-stream.test.mjs tests/usb-service.test.mjs tests/usb-launchers.test.mjs tests/usb-interaction.test.mjs tests/usb-connect-wait.test.mjs tests/usb-local-state.test.mjs tests/usb-snapshot.test.mjs
      - name: Fast shutdown and automatic UI handoff
        run: node --test tests/lifecycle-interruption.test.mjs tests/usb-controller.test.mjs tests/direction-confirmation.test.mjs tests/quick-save-ui.test.mjs tests/launcher-refresh.test.mjs
      - name: Google Drive protocol, encryption, authorization and settings
        run: node --test tests/drive-api.test.mjs tests/drive-repository.test.mjs tests/drive-archive.test.mjs tests/drive-auth.test.mjs tests/drive-ui.test.mjs
      - name: Git snapshot objects and corrupt-pack rejection
        run: node --test tests/git-objects.test.mjs
