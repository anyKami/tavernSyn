name: Diagnose v0.5.2 USB status bridge
on:
  push:
    branches: [codex/usb-live-progress-0.5.2]
    paths: ['.github/workflows/debug-usb-0.5.2.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Cancel superseded, blocked CI attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run in 45041207124 45041246923 45041325171 45041839972 45041888080 45041986311; do
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/$run/cancel" >/dev/null 2>&1 || true
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Isolate watch-port tests with a hard time limit
        run: timeout --signal=KILL 40s node --test tests/usb-monitor.test.mjs
      - name: Isolate each USB test module with separate deadlines
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/usb-*.test.mjs; do
            echo "::group::START $file"
            if timeout --signal=KILL 30s node --test "$file" > /tmp/usb-case.log 2>&1; then
              tail -n 12 /tmp/usb-case.log
              echo "::endgroup::"
            else
              echo "::error::FAILED/HUNG $file"
              cat /tmp/usb-case.log
              exit 1
            fi
          done

# Recheck after making transfer progress optional for lightweight sessions.
