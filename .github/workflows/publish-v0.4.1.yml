name: Publish v0.4.1 stable
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.4.1.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 18d21bb60a4de22ebaea69975e3f9d22a8ddeaf7
      - name: Verify tested source and publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: 18d21bb60a4de22ebaea69975e3f9d22a8ddeaf7
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(node -p "require('./package.json').version")" = "0.4.1"
          test "$(node -p "require('./manifest.json').version")" = "0.4.1"
          gh api repos/anyKami/tavernSyn/actions/runs/45014967187 > "$RUNNER_TEMP/test-run.json"
          jq -e --arg sha "$TESTED_SHA" '.head_sha == $sha and .status == "completed" and .conclusion == "success"' "$RUNNER_TEMP/test-run.json"
          existing="$(gh api repos/anyKami/tavernSyn/git/ref/tags/v0.4.1 2>/dev/null | jq -r '.object.sha // empty' || true)"
          if [ -z "$existing" ]; then
            gh api --method POST repos/anyKami/tavernSyn/git/refs -f ref=refs/tags/v0.4.1 -f sha="$TESTED_SHA"
          else
            test "$existing" = "$TESTED_SHA"
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'RELEASE_NOTES'
          ## Google 云盘同步仓库
          
          本版包含 v0.4.0 新增的 Google 云盘同步功能，并修复原有插件 Git 快照展开时偶发的管道提前关闭错误。请使用本版；已发布的 v0.4.0 标签保持不变。
          
          - 在扩展设置中选择 VPS 或 Google 云盘，支持完整推送、拉取、预览及恢复上一版；电脑和手机不需要同时在线。
          - 完整快照压缩后以 AES-256-GCM 加密，仓库配对码传递仓库身份与解密密钥，Google 授权令牌留在本机。
          - 使用自己的 Google Desktop OAuth 客户端、PKCE、本机回调和 drive.file 权限；提供 Windows 授权导出、Termux 导入备用路径。
          - 不可变签名提交链控制并发发布；确认新版本后清理旧完整快照，保留小型提交记录。
          - 沿用受控保存、停机、SHA-256 校验、插件准备、事务替换、启动健康检查和单份本机恢复备份。
          - Git 直接读取快照文件，避免正常退出与 Node 管道结束事件竞争；仍拒绝校验损坏或截断的数据包。
          
          ## 使用和升级
          
          正常退出酒馆和原启动窗口，再从 Start-TavernSyn.cmd 或 start-tavernsyn.sh 启动，会检查稳定标签并更新前后端。本次不需要更新 VPS。
          
          首次使用需要在自己的 Google Cloud 项目启用 Drive API，创建 Desktop app OAuth 客户端。两端使用同一客户端和 Google 账号；第一台创建仓库，第二台通过配对码加入。External OAuth 应用保持 Testing 状态时，Drive 刷新令牌通常七天后失效；长期自用应按 Google 提示配置发布状态。
          
          详细步骤：[Google 云盘指南](https://github.com/anyKami/tavernSyn/blob/v0.4.1/docs/google-drive.md)。
          
          ## 验证与当前边界
          
          - Node 全量测试 354 项：351 通过、3 个 Windows 专项跳过；Python 40 项、真实 rsync 8 项通过。
          - Linux 全量、Windows Node 22、Linux Node 20 以及 Chromium 界面检查通过；发布工作流核对同一源码提交的 CI 结果后才创建稳定标签。
          - 原有实际 SillyTavern 生命周期与 USB 集成通过；新增 Google 流程完成 7 组检查、8 次实际 ST 1.19.0 启动。
          - Git 管道错误在修复前的 24 次针对性运行中复现 1 次，修复后同样 24 次全部通过；新增有效、损坏、截断、启动失败与句柄释放测试。
          - Google HTTP 服务与 OAuth 响应使用模拟测试，没有访问或实测真实 Google 账号、手机浏览器授权或地区网络。
          - 云盘当前传输完整快照，不提供分类增量、rsync 差分或跨进程断点续传。上传中及清理失败时可暂存新旧文件，无法清理的未提交上传可能暂留，但不会参与拉取应用。
          
          [本版 CI](https://github.com/anyKami/tavernSyn/actions/runs/45014967187)
          
          RELEASE_NOTES
          if gh release view v0.4.1 --repo anyKami/tavernSyn >/dev/null 2>&1; then
            gh release view v0.4.1 --repo anyKami/tavernSyn --json isDraft,isPrerelease --jq '.isDraft == false and .isPrerelease == false' | grep -qx true
          else
            gh release create v0.4.1 --repo anyKami/tavernSyn --verify-tag --latest --title "TavernSyn v0.4.1 — Google 云盘同步与插件快照修复" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
