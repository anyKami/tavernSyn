name: Publish v0.5.1 stable
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.5.1.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.repository == 'anyKami/tavernSyn' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tested source
        uses: actions/checkout@v4
        with:
          ref: f0b7965c9a5686508eebe0a3085a2545ef1f9bb8
          persist-credentials: false
      - name: Verify version and passing CI, create stable tag and Release
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: f0b7965c9a5686508eebe0a3085a2545ef1f9bb8
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(node -p "require('./package.json').version")" = "0.5.1"
          test "$(node -p "require('./manifest.json').version")" = "0.5.1"
          gh api repos/anyKami/tavernSyn/actions/runs/45022122283 > "$RUNNER_TEMP/ci.json"
          jq -e --arg sha "$TESTED_SHA" '.head_sha == $sha and .status == "completed" and .conclusion == "success"' "$RUNNER_TEMP/ci.json"
          existing="$(gh api repos/anyKami/tavernSyn/git/ref/tags/v0.5.1 2>/dev/null | jq -r '.object.sha // empty' || true)"
          if [ -n "$existing" ]; then
            test "$existing" = "$TESTED_SHA" || { echo "::error::v0.5.1 has a different commit"; exit 1; }
          else
            gh api --method POST repos/anyKami/tavernSyn/git/refs -f ref=refs/tags/v0.5.1 -f sha="$TESTED_SHA"
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## 安卓触屏入口
          - 「USB 数据线完整同步」置顶并默认展开，使用高对比卡片和整行连接按钮。
          - 「设置与检查 · 同步仓库」改为整行触屏卡片。操作按钮至少 48 CSS px，USB 主要按钮至少 52 px；窄屏方向按钮自动分行。
          
          ## 点击即执行
          - 完整与分类推送、拉取、恢复上一版、继续上传取消二次确认；仍由用户主动点击方向。
          - 自动停止生成并尝试保存，最长尝试 1.5 秒；超时使用停机后的实际磁盘数据。不再要求清空草稿、关闭编辑弹窗或其他酒馆标签页。
          - 多标签页自动共用一次交接，丢失交接响应会自动重试和续接，不误取消同步。
          - Windows 正常启动和 USB 入口取消按键等待，已安装的标准旧入口自动迁移，无需重装。异常锁恢复不再要求人工 ACK。
          
          ## 快速关闭
          - 不再走日常同步中最长 15 秒排空加 45 秒退出等待的旧流程。
          - 立即关闭当前受控实例的连接，给原生退出 2 秒宽限；仍卡住时自动结束这个所属进程，观察到进程真正退出后再同步。
          - 仅清理 PID、实例标识和安装目录一致的实例锁，确保快速关闭后能重新启动。
          - 最后尚未保存的输入、编辑或生成片段可能丢失；文件校验、事务替换、失败恢复、目标健康检查继续自动执行。
          - 本机仍只保留最新一次覆盖前备份；Google 云盘仍在正常清理后只保留最新完整快照。
          
          ## 测试和升级
          - [此发布源码的完整 CI](https://github.com/anyKami/tavernSyn/actions/runs/45022122283)：Windows / Node 22、Ubuntu / Node 20、Linux / Node 22 与 Chromium UI 检查全部通过。Linux Node 全量 439 项通过、4 项平台跳过；Python 40 项、真实酒馆 33 组、USB 8 组、Drive 7 组、浏览器 9 组检查通过。
          - 覆盖真实 SillyTavern 1.19.0 的卡住退出、强制结束、实例锁清理和重新启动，两个实际酒馆进程的 USB 双向同步，以及 Drive 完整推拉和单份备份。
          - Chromium 使用 320、360、390、430 px 的触摸模拟，检查入口、触摸目标、横向溢出和 USB 双方向点击。未声称安卓真机、实体 USB 数据线或真实 Google 账号验收。
          - Linux / Node 22 CI 隔离测试中，故意挂起插件清理时，同步关闭为 2035 ms、终端关闭为 2030 ms；这是停机阶段耗时，不是整个同步总耗时。
          - 电脑和手机分别从正常 TavernSyn 受控入口重新启动，自动更新到 v0.5.1 后刷新页面。首次 Android USB 调试授权和 Google 账号授权仍由系统完成。
          
          [USB 同步指南](https://github.com/anyKami/tavernSyn/blob/v0.5.1/docs/usb-sync.md) · [更新记录](https://github.com/anyKami/tavernSyn/blob/v0.5.1/CHANGELOG.md)
          NOTES
          if gh release view v0.5.1 --repo anyKami/tavernSyn >/dev/null 2>&1; then
            gh release view v0.5.1 --repo anyKami/tavernSyn --json isDraft,isPrerelease --jq '.isDraft == false and .isPrerelease == false' | grep -qx true
          else
            gh release create v0.5.1 --repo anyKami/tavernSyn --verify-tag --latest --title "TavernSyn v0.5.1 — 安卓触屏与快速自动同步" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
