name: Publish TavernSyn v0.6.0 stable
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.6.0.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.repository == 'anyKami/tavernSyn' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact CI-tested source
        uses: actions/checkout@v4
        with:
          ref: 3a44b7c98002d97c61938e55f536c5648adb7390
          persist-credentials: false
      - name: Verify source and publish stable tag
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: 3a44b7c98002d97c61938e55f536c5648adb7390
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(node -p "require('./package.json').version")" = "0.6.0"
          test "$(node -p "require('./manifest.json').version")" = "0.6.0"
          gh api repos/anyKami/tavernSyn/actions/runs/45132190337 > "$RUNNER_TEMP/verified-ci.json"
          jq -e --arg sha "$TESTED_SHA" '.head_sha == $sha and .status == "completed" and .conclusion == "success"' "$RUNNER_TEMP/verified-ci.json"
          existing="$(gh api repos/anyKami/tavernSyn/git/ref/tags/v0.6.0 2>/dev/null | jq -r '.object.sha // empty' || true)"
          if [ -n "$existing" ]; then
            test "$existing" = "$TESTED_SHA" || { echo "::error::v0.6.0 tag points to an unexpected commit"; exit 1; }
          else
            gh api -X POST repos/anyKami/tavernSyn/git/refs -f ref=refs/tags/v0.6.0 -f sha="$TESTED_SHA"
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## USB 文件级增量同步
          - 电脑 → 手机、手机 → 电脑均自动比较当前两端文件的路径、大小和 SHA-256，只传新增或内容改变的文件。
          - 相同内容在接收端本地复用；即使是首次连接，只要目标已有相同文件也可复用。没有可复用内容时传输完整快照。
          - 同步结果仍是完整镜像：来源删除的文件在目标删除，继续保留设备专用设置与最近一份覆盖前备份。
          - 复用文件和新传文件均校验；本地复用完成并核对完整快照后才应用；传输或复用校验失败时保留原数据与原恢复点。
          - 新旧 USB v2 端自动协商，旧端继续全量传输，无额外配对码、覆盖确认或等待按键。
          
          ## 进度与兼容性
          - 扩展面板分别显示本次实际传输量、本地复用量和完整镜像大小；百分比按本次实际传输量计算。
          - 0 B 文件内容也会展示校验与应用阶段，不会提前报告同步成功；继续没有聊天页面底部浮窗。
          - 文件内容收完后通过状态轮询等待本地复用，避免慢速设备的长时间本地校验触发 HTTP 空闲超时。
          - 目标缺少设置或额外目录、含损坏世界书或聊天时可从健康来源完整恢复。
          
          ## 测试
          - [完整测试的源码与 CI](https://github.com/anyKami/tavernSyn/actions/runs/45132190337)：Windows / Node 22、Linux / Node 20 和 Linux 完整回归全部通过。
          - 覆盖双向增量、同大小同时间但内容改变、零内容传输、删除、复用文件损坏、截断或篡改、旧版本回退、大清单、状态竞态、最新备份恢复。
          - 包含真实 HTTP、真实 SillyTavern 1.19.0 生命周期、CLI 双端选择方向、受控重启，以及 320/360/390/430px Chromium 触屏界面回归。
          - 未连接实体 Windows ↔ Android USB 数据线，不能将自动化测试当作真机验收。
          
          ## 更新与边界
          电脑和 Termux 都关闭原启动窗口，再从 TavernSyn 原有受控入口重新启动，自动更新到 0.6.0 后刷新浏览器。两端均为 0.6.0 即自动使用增量，无需设置新开关。
          
          这是文件级增量：一个大文件内容改变时仍传整个文件。本地仍需完整扫描、快照、校验和暂存空间；不含块差分、压缩和断点续传。统计仅包含文件内容，不含 HTTP 和清单开销。
          
          [USB 使用指南](https://github.com/anyKami/tavernSyn/blob/v0.6.0/docs/usb-sync.md) · [更新记录](https://github.com/anyKami/tavernSyn/blob/v0.6.0/CHANGELOG.md)
          NOTES
          if gh release view v0.6.0 --repo anyKami/tavernSyn >/dev/null 2>&1; then
            gh release view v0.6.0 --repo anyKami/tavernSyn --json isDraft,isPrerelease --jq '.isDraft == false and .isPrerelease == false' | grep -qx true
          else
            gh release create v0.6.0 --repo anyKami/tavernSyn --verify-tag --latest --title 'TavernSyn v0.6.0 — USB 文件级增量同步' --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
