name: Publish v0.4.0 stable
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.4.0.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1ac89c67c58f621e6bb59cfb6b12c7908ab37227
      - name: Verify tested source and publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: 1ac89c67c58f621e6bb59cfb6b12c7908ab37227
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(node -p "require('./package.json').version")" = "0.4.0"
          test "$(node -p "require('./manifest.json').version")" = "0.4.0"
          gh api repos/anyKami/tavernSyn/actions/runs/45014139981 > "$RUNNER_TEMP/test-run.json"
          jq -e --arg sha "$TESTED_SHA" '.head_sha == $sha and .status == "completed" and .conclusion == "success"' "$RUNNER_TEMP/test-run.json"
          existing="$(gh api repos/anyKami/tavernSyn/git/ref/tags/v0.4.0 2>/dev/null | jq -r '.object.sha // empty' || true)"
          if [ -z "$existing" ]; then
            gh api --method POST repos/anyKami/tavernSyn/git/refs -f ref=refs/tags/v0.4.0 -f sha="$TESTED_SHA"
          else
            test "$existing" = "$TESTED_SHA"
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'RELEASE_NOTES'
          ## 新增 Google 云盘同步仓库
          
          - 在扩展设置中选择 VPS 或 Google 云盘，支持完整推送、拉取、预览及恢复上一版；电脑和手机不需要同时在线。
          - 完整快照压缩后以 AES-256-GCM 加密，仓库配对码只传递仓库身份与解密密钥，授权令牌留在本机。
          - 使用 Google Desktop OAuth、PKCE、本机回调和 drive.file 权限；提供 Windows 授权导出、Termux 导入备用路径。
          - 不可变签名提交链保证并发发布单赢家；确认新版本后清理旧完整快照，保留小型提交记录。
          - 沿用现有受控保存、停机、SHA-256 校验、插件准备、事务替换、启动健康检查和单份本机恢复备份。
          - Google-only 安装可使用 setup-device --provider google-drive 跳过 SSH/rsync 运行库。
          
          ## 使用和升级
          
          正常退出酒馆和原启动窗口，再从 Start-TavernSyn.cmd 或 start-tavernsyn.sh 启动，会检查稳定标签并更新前后端。本次不需要更新 VPS。
          
          首次使用 Google 云盘需要在自己的 Google Cloud 项目启用 Drive API、创建 Desktop app OAuth 客户端。两端使用同一客户端和 Google 账号；第一台创建仓库，第二台通过配对码加入。设置为 Testing 的 External OAuth 应用可能七天后需要重新授权。
          
          详细步骤：[Google 云盘指南](https://github.com/anyKami/tavernSyn/blob/v0.4.0/docs/google-drive.md)。
          
          ## 验证与当前边界
          
          - Node 全量测试 349 项：346 通过、3 个 Windows 专项跳过；Python 40 项、真实 rsync 8 项通过。
          - 原有实际 SillyTavern 生命周期集成与 USB 集成通过；新增 Google 流程完成 7 组检查、8 次实际 ST 1.19.0 启动。
          - 发布前要求同一代码提交的 GitHub Linux 全量、Windows Node 22、Linux Node 20 及 Chromium UI 检查全部通过。
          - Google HTTP 服务与 OAuth 响应使用模拟测试，没有访问或实测真实 Google 账号、手机浏览器授权或地区网络。
          - 云盘当前为完整快照传输，不提供分类增量、rsync 差分或跨进程断点续传。上传中及清理失败时可暂存新旧文件，无法清理的未提交上传可能暂留，但不会参与拉取应用。
          
          RELEASE_NOTES
          if gh release view v0.4.0 --repo anyKami/tavernSyn >/dev/null 2>&1; then
            gh release view v0.4.0 --repo anyKami/tavernSyn --json isDraft,isPrerelease --jq '.isDraft == false and .isPrerelease == false' | grep -qx true
          else
            gh release create v0.4.0 --repo anyKami/tavernSyn --verify-tag --latest --title "TavernSyn v0.4.0 — Google 云盘同步仓库" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
