name: Publish TavernSyn v0.5.3 stable
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.5.3.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.repository == 'anyKami/tavernSyn' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact CI-tested source
        uses: actions/checkout@v4
        with:
          ref: 1a7e9303ab195d42ad6c4bf21b79520ddb4c1331
          persist-credentials: false
      - name: Verify source and publish stable tag
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: 1a7e9303ab195d42ad6c4bf21b79520ddb4c1331
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(node -p "require('./package.json').version")" = "0.5.3"
          test "$(node -p "require('./manifest.json').version")" = "0.5.3"
          gh api repos/anyKami/tavernSyn/actions/runs/45091687695 > "$RUNNER_TEMP/verified-ci.json"
          jq -e --arg sha "$TESTED_SHA" '.head_sha == $sha and .status == "completed" and .conclusion == "success"' "$RUNNER_TEMP/verified-ci.json"
          existing="$(gh api repos/anyKami/tavernSyn/git/ref/tags/v0.5.3 2>/dev/null | jq -r '.object.sha // empty' || true)"
          if [ -n "$existing" ]; then
            test "$existing" = "$TESTED_SHA" || { echo "::error::v0.5.3 tag points to an unexpected commit"; exit 1; }
          else
            gh api -X POST repos/anyKami/tavernSyn/git/refs -f ref=refs/tags/v0.5.3 -f sha="$TESTED_SHA"
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## 只在扩展面板内显示 USB 进度
          - 完全删除原先固定在聊天输入框上方的 USB 浮动进度框及其样式。
          - 同步中和同步完成后都不再向酒馆页面主体插入全局进度框。
          - USB 数据线完整同步卡片内继续显示方向、实际传输字节、百分比、文件数量、校验、应用、重启及最终完成状态。
          - 不改动 USB 传输、SHA-256 校验、单份覆盖前备份或受控重启。
          
          ## 测试
          - [经完整测试的源码与 CI](https://github.com/anyKami/tavernSyn/actions/runs/45091687695)：Windows / Node 22、Linux / Node 20、Linux 真实酒馆生命周期和 Chromium 触屏界面检查全部通过。
          - 新增浏览器断言确认开始传输和完成后均不存在页面底部浮动框，扩展内进度仍正确显示。
          - CI 依然没有覆盖实体 Windows ↔ Android USB 数据线。
          
          ## 更新
          Windows 和 Termux 都从 TavernSyn 原有的受控启动入口重新启动，让稳定标签更新机制升级到 v0.5.3，然后刷新浏览器页面。
          
          [USB 使用指南](https://github.com/anyKami/tavernSyn/blob/v0.5.3/docs/usb-sync.md) · [更新记录](https://github.com/anyKami/tavernSyn/blob/v0.5.3/CHANGELOG.md)
          NOTES
          if gh release view v0.5.3 --repo anyKami/tavernSyn >/dev/null 2>&1; then
            gh release view v0.5.3 --repo anyKami/tavernSyn --json isDraft,isPrerelease --jq '.isDraft == false and .isPrerelease == false' | grep -qx true
          else
            gh release create v0.5.3 --repo anyKami/tavernSyn --verify-tag --latest --title 'TavernSyn v0.5.3 — USB 进度仅在扩展内显示' --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
